<style>
:root {
  --bg: #0d0b14;
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-bg-soft: rgba(255, 255, 255, 0.07);
  --glass-border: rgba(255, 255, 255, 0.18);
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.72);
  --accent-1: #8b5cf6;
  --accent-2: #22d3ee;
  --radius-lg: 32px;
  --radius-md: 20px;
  --radius-sm: 18px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Be Vietnam Pro', sans-serif;
  user-select: none;
}

html { scroll-behavior: smooth; }

body {
  min-height: 100vh;
  background-color: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text);
  padding: 20px;
  padding-bottom: 110px;
  overflow-x: hidden;
  position: relative;
}

@keyframes drift1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(6vw, 8vh) scale(1.15); }
}
@keyframes drift2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-5vw, -6vh) scale(1.1); }
}

.bg-video {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  object-fit: cover;
  z-index: -2;
  opacity: 0.85;
}

#particleCanvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  z-index: -1;
  pointer-events: none;
}

#enterOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(10, 8, 18, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  cursor: pointer;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#enterOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.enter-text {
  font-size: 1.2rem;
  font-weight: 600;
  letter-spacing: 3px;
  color: var(--text);
  text-transform: uppercase;
  animation: pulseText 2s infinite ease-in-out;
  text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
}
@keyframes pulseText {
  0%, 100% { opacity: 0.35; transform: scale(0.98); }
  50% { opacity: 1; transform: scale(1.02); }
}

.bio-container {
  width: 100%;
  max-width: 440px;
  background: transparent;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: var(--radius-lg);
  padding: 36px 22px 24px;
  text-align: center;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
  position: relative;
  z-index: 1;
  transform-style: preserve-3d;
  will-change: transform;
  transition: transform 0.15s ease-out, box-shadow 0.3s ease;
}

.datetime-widget {
  width: 100%;
  max-width: 440px;
  margin: 0 auto 18px;
  text-align: center;
}
.datetime-day {
  font-family: 'Alex Brush', cursive;
  font-size: 3rem;
  line-height: 1;
  color: var(--text);
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  margin-bottom: 6px;
}
.datetime-date {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--text-dim);
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
}
.datetime-time {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--text);
  margin-top: 2px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
}
.datetime-divider {
  width: 70%;

}

.page-content {
  display: flex;
  flex-direction: column;
  align-items: center;

}

.avatar-box {

  height: 100px;

.avatar {

.avatar-decoration {

}
.status-dot {

}
.status-dot.online { background: #23a55a; }
.status-dot.idle { background: #f0b232; }
.status-dot.dnd { background: #f23f43; }

.equalizer {

.equalizer span {

.music-player-bar.playing .equalizer span { animation-play-state: running; }
.equalizer span:nth-child(1) { animation-duration: 0.7s; }
.equalizer span:nth-child(2) { animation-duration: 0.9s; animation-delay: 0.15s; }
.equalizer span:nth-child(3) { animation-duration: 0.8s; animation-delay: 0.3s; }
.equalizer span:nth-child(4) { animation-duration: 1s; animation-delay: 0.1s; }
@keyframes eqBounce { 0%, 100% { height: 3px; } 50% { height: 12px; } }

.timeline-box {

  gap: 8px;
  font-size: 0.72rem;
  color: rgba(255, 255, 255, 0.75);
}
.progress-bar-bg {
  flex: 1;
  height: 4px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  cursor: pointer;

}
.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
  border-radius: 4px;
  transition: width 0.1s linear;
}
.player-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  color: rgba(255, 255, 255, 0.9);
  font-size: 1.1rem;
}
.player-controls i {
  cursor: pointer;
  transition: transform 0.15s ease, color 0.15s ease;
}
.player-controls i:hover { transform: scale(1.18); color: #ecf0f1; }

::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);

}
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.25);
  border-radius: 10px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(255, 255, 255, 0.45);
  background-clip: padding-box;
}
html { scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.25) rgba(255, 255, 255, 0.05); }

/* ---------- Responsive ---------- */
@media (max-width: 480px) {
  .bio-container { padding: 30px 16px 20px; border-radius: 26px; }
  .avatar-box { width: 84px; height: 84px; }
  .display-name { font-size: 1.4rem; }

}

/* ---------- Respect reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
</style>

<script>
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('dragstart', function (e) { e.preventDefault(); });
document.addEventListener('drop', function (e) { e.preventDefault(); });
document.addEventListener('selectstart', function (e) { e.preventDefault(); });
['copy', 'cut', 'paste'].forEach(function (evt) {
  document.addEventListener(evt, function (e) { e.preventDefault(); });
});
document.addEventListener('keydown', function (e) {
  const key = e.key.toLowerCase();
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && ['i', 'j', 'c'].includes(key)) ||
    (e.ctrlKey && ['u', 's'].includes(key))
  ) {
    e.preventDefault();
    return false;
  }
});

const fullTitle = "Bio Link - Thien 💤💤";
let charIndex = 0;
let isDeleting = false;
function animateTitle() {
  if (!isDeleting) {
    document.title = fullTitle.substring(0, charIndex + 1);
    charIndex++;
    if (charIndex === fullTitle.length) {
      isDeleting = true;
      setTimeout(animateTitle, 2000);
      return;
    }
  } else {
    document.title = fullTitle.substring(0, charIndex - 1);
    charIndex--;
    if (charIndex === 0) {
      isDeleting = false;
      setTimeout(animateTitle, 800);
      return;
    }
  }
  setTimeout(animateTitle, isDeleting ? 100 : 160);
}
animateTitle();

// ---------- Particle background ----------
(function () {
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();
  const PARTICLE_COUNT = 34;
  function makeParticle() {
    return {
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.8 + 0.6,
      speedY: Math.random() * 0.5 + 0.2,
      speedX: (Math.random() - 0.5) * 0.3,
      opacity: Math.random() * 0.5 + 0.2
    };
  }
  const particles = Array.from({ length: PARTICLE_COUNT }, makeParticle);
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function animateParticles() {
    ctx.clearRect(0, 0, w, h);
    for (const p of particles) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
      ctx.fill();
      if (!reduceMotion) {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y > h + 5) { p.y = -5; p.x = Math.random() * w; }
        if (p.x > w + 5) p.x = -5;
        if (p.x < -5) p.x = w + 5;
      }
    }
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
})();

// ---------- 3D tilt on mousemove (desktop only) ----------
(function () {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const bio = document.getElementById('bioContainer');
  const player = document.getElementById('musicPlayerBar');
  const maxTilt = 8; // Tăng độ lắc/nghiêng từ 1 lên 8
  function applyTilt(el, rect, baseTransform) {
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    return function (e) {
      const dx = (e.clientX - centerX) / (window.innerWidth / 2);
      const dy = (e.clientY - centerY) / (window.innerHeight / 2);
      const rotateY = dx * maxTilt;
      const rotateX = -dy * maxTilt;
      el.style.transform = `${baseTransform} perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    };
  }
  document.addEventListener('mousemove', (e) => {
    applyTilt(bio, bio.getBoundingClientRect(), '')(e);
    applyTilt(player, player.getBoundingClientRect(), 'translateX(-50%)')(e);
  });
  document.addEventListener('mouseleave', () => {
    bio.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
    player.style.transform = 'translateX(-50%) perspective(900px) rotateX(0deg) rotateY(0deg)';
  });
})();

const avatarUserId = "1523492429125386292";
const playlist = [
  { title: "Anh Là Ai", src: "nhac1.mp3" },
  { title: "Ai Đưa Em Về", src: "nhac2.mp3" }
];
let currentTrack = 0;
const audio = new Audio();
let isPlaying = false;

function setupViewsCounter() {
  const viewsValueEl = document.getElementById('viewsValue');
  const baseViews = parseInt(localStorage.getItem('profile_views') || '94', 10);
  const currentSession = sessionStorage.getItem('counted_this_session');

  if (!currentSession) {
    const updatedViews = baseViews + 1;
    localStorage.setItem('profile_views', updatedViews.toString());
    sessionStorage.setItem('counted_this_session', '1');

    let current = baseViews;
    const target = updatedViews;
    const step = Math.max(1, Math.ceil((target - current) / 14));
    const timer = setInterval(() => {
      current += step;
      if (current >= target) {
        current = target;
        clearInterval(timer);
      }
      viewsValueEl.innerText = current;
    }, 80);
  } else {
    viewsValueEl.innerText = baseViews;
  }
}

function loadTrack(index) {
  currentTrack = index;
  audio.src = playlist[index].src;
  document.getElementById('songTitle').innerText = playlist[index].title;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('currentTime').innerText = "0:00";
}
function playMusic() {
  audio.play().then(() => {
    isPlaying = true;
    document.getElementById('playBtn').className = "fa-solid fa-pause";
    document.getElementById('musicPlayerBar').classList.add('playing');
  }).catch(() => console.log("Cần click để phát nhạc"));
}
function pauseMusic() {
  audio.pause();
  isPlaying = false;
  document.getElementById('playBtn').className = "fa-solid fa-play";
  document.getElementById('musicPlayerBar').classList.remove('playing');
}

document.getElementById('enterOverlay').addEventListener('click', () => {
  document.getElementById('enterOverlay').classList.add('hidden');
  setupViewsCounter();
  playMusic();
  const bgVideo = document.getElementById('bgVideo');
  if (bgVideo) bgVideo.play().catch(() => {});
});

document.getElementById('playBtn').addEventListener('click', () => {
  if (isPlaying) pauseMusic(); else playMusic();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  currentTrack = (currentTrack + 1) % playlist.length;
  loadTrack(currentTrack);
  playMusic();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
  loadTrack(currentTrack);
  playMusic();
});

['prevBtn', 'playBtn', 'nextBtn'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.target.click(); }
  });
});

audio.addEventListener('timeupdate', () => {
  if (audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
    document.getElementById('durationTime').innerText = formatTime(audio.duration);
  }
});
audio.addEventListener('ended', () => {
  currentTrack = (currentTrack + 1) % playlist.length;
  loadTrack(currentTrack);
  playMusic();
});

document.getElementById('progressBarBg').addEventListener('click', (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  if (audio.duration) audio.currentTime = pos * audio.duration;
});

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

async function fetchDiscordData() {
  try {
    const response = await fetch(`https://api.lanyard.rest/v1/users/${avatarUserId}`);
    const data = await response.json();
    if (data.success && data.data) {
      const user = data.data.discord_user;
      if (user.avatar) {
        const ext = user.avatar.startsWith("a_") ? "gif" : "png";
        document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${avatarUserId}/${user.avatar}.${ext}?size=256`;
      }
      if (user.avatar_decoration_data) {
        const decoHash = user.avatar_decoration_data.asset;
        const decoImg = document.getElementById('avatarDecoration');
        decoImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${decoHash}.png?size=240&passthrough=true`;
        decoImg.style.display = 'block';
      }
      const statusDot = document.getElementById('statusDot');
      const status = data.data.discord_status || 'offline';
      statusDot.className = 'status-dot ' + status;
      const activities = (data.data.activities || []).filter(a => a.type !== 4);
      const activityBadge = document.getElementById('activityBadge');
      const activityIcon = document.getElementById('activityIcon');
      const activityText = document.getElementById('activityText');
      if (activities.length > 0) {
        const act = activities[0];
        const icons = { 0: '🎮︎', 1: '🔴', 2: '🎧︎ ', 3: '📺︎', 5: '🏆︎' };
        activityIcon.innerText = icons[act.type] || '✨︎';
        activityText.innerText = act.name;
        activityBadge.style.display = 'inline-flex';
      } else {
        activityBadge.style.display = 'none';
      }
    }
  } catch (err) {
    console.log("Không lấy được dữ liệu Discord");
  }
}

(function () {
  const dayNames = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
  const dtDay = document.getElementById('dtDay');
  const dtDate = document.getElementById('dtDate');
  const dtTime = document.getElementById('dtTime');
  function pad(n) { return n < 10 ? '0' + n : n; }
  function updateClock() {
    const now = new Date();
    dtDay.innerText = dayNames[now.getDay()];
    dtDate.innerText = `${pad(now.getDate())}. ${monthNames[now.getMonth()]}, ${now.getFullYear()}.`;
    let hours = now.getHours();
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    if (hours === 0) hours = 12;
    dtTime.innerText = `${pad(hours)}:${pad(now.getMinutes())} ${ampm}`;
  }
  updateClock();
  setInterval(updateClock, 1000);
})();

loadTrack(0);
fetchDiscordData();
</script>
