<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Trang liên kết mạng xã hội cá nhân.">
<meta name="theme-color" content="#0d0b14">
<title>Bio Link</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Alex+Brush&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
<source src="bg.mp4" type="video/mp4">
</video>
<canvas id="particleCanvas"></canvas>

<div id="loadingOverlay" class="loading-screen">
<canvas id="constellationCanvas"></canvas>
<div class="loading-box">
<div class="kaomoji-wrap" aria-label="Loading">
<span class="kaomoji-char c1">&gt;</span>
<span class="kaomoji-char c2">_</span>
<span class="kaomoji-char c3">&lt;</span>
</div>
<div class="loading-percent" id="loadingPercent">0%</div>
<div class="loading-welcome">Welcome to my profile</div>
</div>
</div>

<div id="enterOverlay" class="hidden">
<div class="click-text">Click to enter...</div>
<div class="click-hint">nhấn để tiếp tục</div>
</div>

<div class="page-content mobile-only">
<div class="datetime-widget" id="datetimeWidget">
<div class="datetime-day" id="dtDay">Monday</div>
<div class="datetime-date" id="dtDate">27. JULY, 2026.</div>
<div class="datetime-time" id="dtTime">09:07 AM</div>
<hr class="datetime-divider">
</div>
<div class="bio-container" id="bioContainer">
<div class="avatar-box">
<img id="userAvatar" class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar" onerror="this.onerror=null;this.src='https://cdn.discordapp.com/embed/avatars/0.png';">
<img id="avatarDecoration" class="avatar-decoration" src="" alt="" style="display: none;" onerror="this.style.display='none';">
<span class="status-dot offline" id="statusDot"></span>
</div>
<h1 class="display-name" id="userName">@thn.wtf</h1>
<div class="activity-badge" id="activityBadge" style="display: none;">
<span id="activityIcon">🎮</span>
<span id="activityText"></span>
</div>
<p class="bio-text" id="userBio">Ngủ 💤</p>
<div class="location-tag">
<i class="fa-solid fa-location-dot"></i>
<span>Việt Nam</span>
</div>
<div class="links-container">
<a href="https://www.facebook.com/thien.huynh.ngoc.197335" target="_blank" rel="noopener noreferrer" class="link-card facebook">
<div class="link-left">
<i class="fa-brands fa-facebook"></i>
<span>Facebook</span>
</div>
<i class="fa-solid fa-arrow-up-right-from-square action-icon"></i>
</a>
<a href="https://discord.com/users/1102948425126920242" target="_blank" rel="noopener noreferrer" class="link-card discord">
<div class="link-left">
<i class="fa-brands fa-discord"></i>
<span>Discord</span>
</div>
<i class="fa-solid fa-arrow-up-right-from-square action-icon"></i>
</a>
<a href="https://www.tiktok.com/@thn.wtf" target="_blank" rel="noopener noreferrer" class="link-card tiktok">
<div class="link-left">
<i class="fa-brands fa-tiktok"></i>
<span>TikTok</span>
</div>
<i class="fa-solid fa-arrow-up-right-from-square action-icon"></i>
</a>
<a href="https://github.com/thienvl1395-dot" target="_blank" rel="noopener noreferrer" class="link-card github">
<div class="link-left">
<i class="fa-brands fa-github"></i>
<span>GitHub</span>
</div>
<i class="fa-solid fa-arrow-up-right-from-square action-icon"></i>
</a>
</div>
<div class="views-tag">
<i class="fa-regular fa-eye"></i>
<span id="viewsValue"></span>
</div>
</div>
</div>

<div class="cosmic-container desktop-only">
<div class="datetime-widget datetime-desktop">
<div class="datetime-day">Monday</div>
<div class="datetime-date">27. JULY, 2026.</div>
<div class="datetime-time">09:07 AM</div>
<hr class="datetime-divider">
</div>

<section class="hero-matrix">
<div class="avatar-constellation">
<div class="avatar-rings">
<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>
</div>
<div class="avatar-master">
<img id="deskAvatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar" onerror="this.onerror=null;this.src='https://cdn.discordapp.com/embed/avatars/0.png';">
<img id="avatarDecorationDesk" class="avatar-decoration-desk" src="" alt="" onerror="this.style.display='none';">
</div>
</div>

<div class="legend-info">
<h1 class="legend-title">@Thn.wtf</h1>
<p class="legend-subtitle">💤Việt Nam 💤</p>
</div>
</section>

<div class="social-cosmos" id="socialCosmos">
<div class="social-header">
<h2 class="social-title">About me</h2>
</div>

<div class="social-links-grid">
<a href="https://www.facebook.com/thien.huynh.ngoc.197335" target="_blank" rel="noopener noreferrer" class="social-link-enhanced">
<div class="social-link-icon fb"><i class="fa-brands fa-facebook"></i></div>
<div class="social-link-text">
<div class="social-link-title">Facebook</div>
<div class="social-link-subtitle"></div>
</div>
</a>

<a href="https://discord.com/users/1102948425126920242" target="_blank" rel="noopener noreferrer" class="social-link-enhanced">
<div class="social-link-icon dc"><i class="fa-brands fa-discord"></i></div>
<div class="social-link-text">
<div class="social-link-title">Discord</div>
<div class="social-link-subtitle"></div>
</div>
</a>

<a href="https://www.tiktok.com/@thn.wtf" target="_blank" rel="noopener noreferrer" class="social-link-enhanced">
<div class="social-link-icon tt"><i class="fa-brands fa-tiktok"></i></div>
<div class="social-link-text">
<div class="social-link-title">TikTok</div>
<div class="social-link-subtitle"></div>
</div>
</a>

<a href="https://github.com/thienvl1395-dot" target="_blank" rel="noopener noreferrer" class="social-link-enhanced">
<div class="social-link-icon gh"><i class="fa-brands fa-github"></i></div>
<div class="social-link-text">
<div class="social-link-title">GitHub</div>
<div class="social-link-subtitle"></div>
</div>
</a>
</div>
</div>

<div class="views-tag views-desktop">
<i class="fa-regular fa-eye"></i>
<span id="deskViews"></span>
</div>
</div>

<div class="music-player-bar" id="musicPlayerBar">
<img id="musicThumb" class="song-video-media" src="dislay.png" alt="">
<div class="player-info">
<div class="song-title-row">
<div id="songTitle" class="song-title">Anh Là Ai</div>
<div class="equalizer">
<span></span><span></span><span></span><span></span>
</div>
</div>
<div class="timeline-box">
<span id="currentTime">0:00</span>
<div class="progress-bar-bg" id="progressBarBg">
<div class="progress-fill" id="progressFill"></div>
</div>
<span id="durationTime">0:00</span>
</div>
</div>
<div class="player-controls">
<i class="fa-solid fa-step-backward" id="prevBtn" role="button" aria-label="Bài trước" tabindex="0"></i>
<i class="fa-solid fa-play" id="playBtn" role="button" aria-label="Phát/Tạm dừng" tabindex="0"></i>
<i class="fa-solid fa-step-forward" id="nextBtn" role="button" aria-label="Bài tiếp" tabindex="0"></i>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
