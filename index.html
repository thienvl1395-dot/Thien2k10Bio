<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bio Link</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Be Vietnam Pro', sans-serif;
user-select: none;
}
body {
min-height: 100vh;
background-color: #0d0b14;
display: flex;
justify-content: center;
align-items: center;
color: #fff;
padding: 20px;
padding-bottom: 110px;
overflow-x: hidden;
position: relative;
}
.bg-video {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
object-fit: cover;
z-index: -2;
}
#particleCanvas {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
z-index: -1;
pointer-events: none;
}
#enterOverlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(10, 8, 18, 0.75);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
display: flex;
justify-content: center;
align-items: center;
z-index: 9999;
cursor: pointer;
transition: opacity 0.6s ease, visibility 0.6s ease;
}
#enterOverlay.hidden {
opacity: 0;
visibility: hidden;
pointer-events: none;
}
.enter-text {
font-size: 1.2rem;
font-weight: 600;
letter-spacing: 3px;
color: #ffffff;
text-transform: uppercase;
animation: pulseText 2s infinite ease-in-out;
text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
}
@keyframes pulseText {
0%, 100% { opacity: 0.35; transform: scale(0.98); }
50% { opacity: 1; transform: scale(1.02); }
}
.bio-container {
width: 100%;
max-width: 440px;
background: rgba(255, 255, 255, 0.14);
backdrop-filter: blur(3px);
-webkit-backdrop-filter: blur(3px);
border: 1px solid rgba(255, 255, 255, 0.3);
border-radius: 32px;
padding: 36px 22px 24px;
text-align: center;
box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
position: relative;
transform-style: preserve-3d;
will-change: transform;
transition: transform 0.15s ease-out;
}
.avatar-box {
position: relative;
width: 100px;
height: 100px;
margin: 0 auto 16px;
}
.avatar {
width: 100%;
height: 100%;
border-radius: 50%;
object-fit: cover;
position: relative;
z-index: 1;
}
.avatar-decoration {
position: absolute;
top: -12%;
left: -12%;
width: 124%;
height: 124%;
pointer-events: none;
z-index: 2;
}
.display-name {
font-size: 1.65rem;
font-weight: 700;
color: #ffffff;
margin-bottom: 6px;
text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
}
.bio-text {
color: rgba(255, 255, 255, 0.95);
font-size: 0.98rem;
font-weight: 500;
margin-bottom: 8px;
text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}
.location-tag {
display: inline-flex;
align-items: center;
gap: 6px;
color: rgba(255, 255, 255, 0.85);
font-size: 0.85rem;
font-weight: 500;
margin-bottom: 24px;
text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
}
.links-container {
display: flex;
flex-direction: column;
gap: 12px;
margin-bottom: 24px;
}
.link-card {
display: flex;
align-items: center;
justify-content: space-between;
padding: 14px 20px;
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 255, 255, 0.18);
border-radius: 18px;
color: #ffffff;
text-decoration: none;
font-weight: 600;
font-size: 0.95rem;
transition: all 0.25s ease;
}
.link-card:hover {
transform: translateY(-2px);
background: rgba(255, 255, 255, 0.18);
border-color: rgba(255, 255, 255, 0.35);
box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}
.link-left {
display: flex;
align-items: center;
gap: 14px;
}
.link-left i {
font-size: 1.35rem;
width: 22px;
text-align: center;
}
.facebook .link-left i, .facebook .action-icon { color: #1877f2; }
.discord .link-left i, .discord .action-icon { color: #5865f2; }
.tiktok .link-left i, .tiktok .action-icon { color: #ff0050; }
.action-icon {
font-size: 0.9rem;
opacity: 0.85;
transition: transform 0.2s ease;
}
.link-card:hover .action-icon {
transform: translate(2px, -2px);
opacity: 1;
}
.views-tag {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.88rem;
font-weight: 600;
color: rgba(255, 255, 255, 0.9);
text-align: left;
text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
}
.music-player-bar {
position: fixed;
bottom: 20px;
left: 50%;
transform: translateX(-50%);
width: 90%;
max-width: 450px;
background: rgba(255, 255, 255, 0.14);
backdrop-filter: blur(3px);
-webkit-backdrop-filter: blur(3px);
border: 1px solid rgba(255, 255, 255, 0.3);
border-radius: 20px;
padding: 10px 16px;
display: flex;
align-items: center;
gap: 14px;
box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
z-index: 100;
transform-style: preserve-3d;
will-change: transform;
transition: transform 0.15s ease-out;
}
.song-video-media {
width: 48px;
height: 48px;
border-radius: 12px;
object-fit: cover;
background: #000;
flex-shrink: 0;
}
.player-info {
flex: 1;
display: flex;
flex-direction: column;
gap: 5px;
overflow: hidden;
text-align: left;
}
.song-title {
font-size: 0.88rem;
font-weight: 600;
color: #ffffff;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.timeline-box {
display: flex;
align-items: center;
gap: 8px;
font-size: 0.72rem;
color: rgba(255, 255, 255, 0.75);
}
.progress-bar-bg {
flex: 1;
height: 4px;
background: rgba(255, 255, 255, 0.2);
border-radius: 4px;
cursor: pointer;
position: relative;
}
.progress-fill {
width: 0%;
height: 100%;
background: #ffffff;
border-radius: 4px;
transition: width 0.1s linear;
}
.player-controls {
display: flex;
align-items: center;
gap: 12px;
color: rgba(255, 255, 255, 0.9);
font-size: 1.1rem;
}
.player-controls i {
cursor: pointer;
transition: transform 0.15s ease, color 0.15s ease;
}
.player-controls i:hover {
transform: scale(1.18);
color: #38bdf8;
}
</style>
</head>
<body>
<video id="bgVideo" class="bg-video" autoplay loop muted playsinline>
<source src="bg.mp4" type="video/mp4">
</video>
<canvas id="particleCanvas"></canvas>
<div id="enterOverlay">
<div class="enter-text">Click to enter</div>
</div>
<div class="bio-container" id="bioContainer">
<div class="avatar-box">
<img id="userAvatar" class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
<img id="avatarDecoration" class="avatar-decoration" src="" alt="Khung Discord" style="display: none;">
</div>
<h1 class="display-name" id="userName">💤💤</h1>
<p class="bio-text" id="userBio">Buồn Ngủ</p>
<div class="location-tag">
<i class="fa-solid fa-location-dot"></i>
<span>Quãng Ngãi, Việt Nam</span>
</div>
<div class="links-container">
<a href="https://www.facebook.com/thien.huynh.ngoc.197335" target="_blank" class="link-card facebook">
<div class="link-left">
<i class="fa-brands fa-facebook"></i>
<span>Facebook</span>
</div>
<i class="fa-solid fa-arrow-up-right-from-square action-icon"></i>
</a>
<a href="https://discord.com/users/1102948425126920242" target="_blank" class="link-card discord">
<div class="link-left">
<i class="fa-brands fa-discord"></i>
<span>Discord</span>
</div>
<i class="fa-solid fa-arrow-up-right-from-square action-icon"></i>
</a>
<a href="https://www.tiktok.com/@thn.wtf" target="_blank" class="link-card tiktok">
<div class="link-left">
<i class="fa-brands fa-tiktok"></i>
<span>TikTok</span>
</div>
<i class="fa-solid fa-arrow-up-right-from-square action-icon"></i>
</a>
</div>
<div class="views-tag">
<i class="fa-regular fa-eye"></i>
<span id="viewsValue">94</span>
</div>
</div>
<div class="music-player-bar" id="musicPlayerBar">
<img id="musicThumb" class="song-video-media" src="dislay.png" alt="Thumbnail Nhạc">
<div class="player-info">
<div id="songTitle" class="song-title">Ai Đưa Em Về</div>
<div class="timeline-box">
<span id="currentTime">0:00</span>
<div class="progress-bar-bg" id="progressBarBg">
<div class="progress-fill" id="progressFill"></div>
</div>
<span id="durationTime">0:00</span>
</div>
</div>
<div class="player-controls">
<i class="fa-solid fa-step-backward" id="prevBtn"></i>
<i class="fa-solid fa-play" id="playBtn"></i>
<i class="fa-solid fa-step-forward" id="nextBtn"></i>
</div>
</div>
<script>
/* ===== Chặn chuột phải / DevTools / xem nguồn / copy (chỉ mang tính hạn chế cơ bản, không tuyệt đối) ===== */
document.addEventListener('contextmenu', function (e) {
e.preventDefault();
});
document.addEventListener('keydown', function (e) {
// F12
if (e.key === 'F12') {
e.preventDefault();
return false;
}
// Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C (DevTools, Console, Inspect Element)
if (e.ctrlKey && e.shiftKey && ['I', 'i', 'J', 'j', 'C', 'c'].includes(e.key)) {
e.preventDefault();
return false;
}
// Ctrl+U (View Source)
if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
e.preventDefault();
return false;
}
// Ctrl+S (Save Page)
if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
e.preventDefault();
return false;
}
});
document.addEventListener('copy', function (e) {
e.preventDefault();
});
document.addEventListener('cut', function (e) {
e.preventDefault();
});
document.addEventListener('selectstart', function (e) {
e.preventDefault();
});
document.addEventListener('dragstart', function (e) {
e.preventDefault();
});
</script>
<script>
const fullTitle = "Bio Link - Thien 💤💤";
let charIndex = 0;
let isDeleting = false;
function animateTitle() {
if (!isDeleting) {
document.title = fullTitle.substring(0, charIndex + 1);
charIndex++;
if (charIndex === fullTitle.length) {
isDeleting = true;
setTimeout(animateTitle, 2000);
return;
}
} else {
document.title = fullTitle.substring(0, charIndex - 1);
charIndex--;
if (charIndex === 0) {
isDeleting = false;
setTimeout(animateTitle, 800);
return;
}
}
setTimeout(animateTitle, isDeleting ? 100 : 160);
}
animateTitle();
(function () {
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize() {
w = canvas.width = window.innerWidth;
h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();
const PARTICLE_COUNT = 34;
function makeParticle() {
return {
x: Math.random() * w,
y: Math.random() * h,
r: Math.random() * 1.8 + 0.6,
speedY: Math.random() * 0.5 + 0.2,
speedX: (Math.random() - 0.5) * 0.3,
opacity: Math.random() * 0.5 + 0.2
};
}
const particles = Array.from({ length: PARTICLE_COUNT }, makeParticle);
function animateParticles() {
ctx.clearRect(0, 0, w, h);
for (const p of particles) {
ctx.beginPath();
ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
ctx.fill();
p.y += p.speedY;
p.x += p.speedX;
if (p.y > h + 5) {
p.y = -5;
p.x = Math.random() * w;
}
if (p.x > w + 5) p.x = -5;
if (p.x < -5) p.x = w + 5;
}
requestAnimationFrame(animateParticles);
}
animateParticles();
})();
(function () {
const bio = document.getElementById('bioContainer');
const player = document.getElementById('musicPlayerBar');
const maxTilt = 6;
function applyTilt(el, rect, baseTransform) {
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
return function (e) {
const dx = (e.clientX - centerX) / (window.innerWidth / 2);
const dy = (e.clientY - centerY) / (window.innerHeight / 2);
const rotateY = dx * maxTilt;
const rotateX = -dy * maxTilt;
el.style.transform = `${baseTransform} perspective(900px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
};
}
document.addEventListener('mousemove', (e) => {
const bioRect = bio.getBoundingClientRect();
applyTilt(bio, bioRect, '')(e);
const playerRect = player.getBoundingClientRect();
applyTilt(player, playerRect, 'translateX(-50%)')(e);
});
document.addEventListener('mouseleave', () => {
bio.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg)';
player.style.transform = 'translateX(-50%) perspective(900px) rotateX(0deg) rotateY(0deg)';
});
})();
const avatarUserId = "1523492429125386292";
const playlist = [
{ title: "Ai Đưa Em Về", src: "nhac1.mp3" },
{ title: "Giờ Thì", src: "nhac2.mp3" }
];
let currentTrack = 0;
const audio = new Audio();
let isPlaying = false;
function setupViewsCounter() {
let views = parseInt(localStorage.getItem('profile_views') || '94');
views += 1;
localStorage.setItem('profile_views', views.toString());
document.getElementById('viewsValue').innerText = views;
}
function loadTrack(index) {
currentTrack = index;
audio.src = playlist[index].src;
document.getElementById('songTitle').innerText = playlist[index].title;
document.getElementById('progressFill').style.width = '0%';
document.getElementById('currentTime').innerText = "0:00";
}
function playMusic() {
audio.play().then(() => {
isPlaying = true;
document.getElementById('playBtn').className = "fa-solid fa-pause";
}).catch(e => console.log("Cần click để phát nhạc"));
}
function pauseMusic() {
audio.pause();
isPlaying = false;
document.getElementById('playBtn').className = "fa-solid fa-play";
}
document.getElementById('enterOverlay').addEventListener('click', () => {
document.getElementById('enterOverlay').classList.add('hidden');
setupViewsCounter();
playMusic();
const bgVideo = document.getElementById('bgVideo');
if (bgVideo) bgVideo.play();
});
document.getElementById('playBtn').addEventListener('click', () => {
if (isPlaying) pauseMusic();
else playMusic();
});
document.getElementById('nextBtn').addEventListener('click', () => {
currentTrack = (currentTrack + 1) % playlist.length;
loadTrack(currentTrack);
playMusic();
});
document.getElementById('prevBtn').addEventListener('click', () => {
currentTrack = (currentTrack - 1 + playlist.length) % playlist.length;
loadTrack(currentTrack);
playMusic();
});
audio.addEventListener('timeupdate', () => {
if (audio.duration) {
const pct = (audio.currentTime / audio.duration) * 100;
document.getElementById('progressFill').style.width = pct + '%';
document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
document.getElementById('durationTime').innerText = formatTime(audio.duration);
}
});
audio.addEventListener('ended', () => {
currentTrack = (currentTrack + 1) % playlist.length;
loadTrack(currentTrack);
playMusic();
});
document.getElementById('progressBarBg').addEventListener('click', (e) => {
const rect = e.target.getBoundingClientRect();
const pos = (e.clientX - rect.left) / rect.width;
if (audio.duration) {
audio.currentTime = pos * audio.duration;
}
});
function formatTime(sec) {
const m = Math.floor(sec / 60);
const s = Math.floor(sec % 60);
return `${m}:${s < 10 ? '0' : ''}${s}`;
}
async function fetchDiscordData() {
try {
const response = await fetch(`https://api.lanyard.rest/v1/users/${avatarUserId}`);
const data = await response.json();
if (data.success && data.data) {
const user = data.data.discord_user;
if (user.avatar) {
const ext = user.avatar.startsWith("a_") ? "gif" : "png";
document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${avatarUserId}/${user.avatar}.${ext}?size=256`;
}
if (user.avatar_decoration_data) {
const decoHash = user.avatar_decoration_data.asset;
const decoImg = document.getElementById('avatarDecoration');
decoImg.src = `https://cdn.discordapp.com/avatar-decoration-presets/${decoHash}.png?size=240&passthrough=true`;
decoImg.style.display = 'block';
}
}
} catch (err) {
console.log("NNNNNNNN");
}
}
loadTrack(0);
fetchDiscordData();
  <script>
// Chặn chuột phải
document.addEventListener("contextmenu", e => e.preventDefault());

// Chặn kéo thả
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("drop", e => e.preventDefault());

// Chặn bôi đen
document.addEventListener("selectstart", e => e.preventDefault());

// Chặn copy/cut/paste
["copy","cut","paste"].forEach(event => {
    document.addEventListener(event, e => e.preventDefault());
});

// Chặn phím tắt
document.addEventListener("keydown", function(e) {
    const key = e.key.toLowerCase();

    if (
        e.key === "F12" ||                          // F12
        (e.ctrlKey && key === "u") ||              // Ctrl+U
        (e.ctrlKey && key === "i") ||              // Ctrl+I
        (e.ctrlKey && e.shiftKey && key === "i") ||// Ctrl+Shift+I
        (e.ctrlKey && e.shiftKey && key === "j") ||// Ctrl+Shift+J
        (e.ctrlKey && key === "s") ||              // Ctrl+S
        (e.ctrlKey && key === "c") ||              // Ctrl+C
        (e.ctrlKey && key === "v") ||              // Ctrl+V
        (e.ctrlKey && key === "x") ||              // Ctrl+X
        (e.ctrlKey && key === "a")                 // Ctrl+A
    ) {
        e.preventDefault();
        return false;
    }
});
</script>
</script>
</body>
</html>
